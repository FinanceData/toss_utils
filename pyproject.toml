[project]
name = "toss_utils"
version = "0.1.0"
description = "토스증권 Open API 클라이언트 라이브러리 + CLI + MCP 서버 (안전장치 포함)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
ws = ["websockets>=13"]
analytics = ["duckdb>=1.0"]
mcp = ["mcp>=1.9", "websockets>=13"]

[project.scripts]
toss = "toss_utils.cli:main"
toss-mcp = "toss_utils.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toss_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
