[project]
name = "toss-utils"
version = "0.1.0"
description = "토스증권(tossinvest.com) 웹 API URL 정리 및 유틸"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
toss = "main:main"

[dependency-groups]
dev = ["pytest>=8.0", "pandas>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["toss_utils.py", "main.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
